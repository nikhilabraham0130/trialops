name: trialops

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${TRIALOPS_POSTGRES_USER:?Set TRIALOPS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${TRIALOPS_POSTGRES_PASSWORD:?Set TRIALOPS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${TRIALOPS_POSTGRES_DB:?Set TRIALOPS_POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${TRIALOPS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb

volumes:
  postgres_data:
